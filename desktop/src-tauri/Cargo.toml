[package]
name = "marina-ims-desktop"
version = "0.4.0"
edition = "2021"
description = "Desktop shell for the Marina Trading Inventory Monitoring System"
authors = ["Marina Trading"]
publish = false

[lib]
name = "marina_ims_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Kept deliberately small. The health probe is a raw TcpStream rather than an
# HTTP client crate, and the server is a std::process::Child rather than
# tauri-plugin-shell, so killing it when the window closes is unambiguous.
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only, deliberately: this talks to one server on the office LAN,
# over the same http:// the rest of the application uses. Default features
# would pull a TLS stack in for a connection that never uses one. Downloading
# an installer is the one thing here that wants a real client rather than the
# hand-rolled TcpStream probe - it has a body worth streaming to disk.
ureq = { version = "2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
